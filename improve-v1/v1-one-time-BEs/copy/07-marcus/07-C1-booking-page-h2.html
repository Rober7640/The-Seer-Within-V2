  07-C1 · h2 — REVERSIBLE.  g1's page with the rungs moved above the boxes, and the number
  she picks treated as a DRAFT: she writes, the page reads what she wrote, and Marcus offers to
  move her up or down before she pays.

  THE ORDER OF EVENTS
    1  "{N} cards. You've seen {N} of them."       the headline that counts   — g1
    2  the strip — turned, and still face down                                — g1
    3  "How many things are you asking me?"        the three rungs            — g1's own words
    4  a rung opens EVERY box it bought, in place  ← the demonstration, box one included
    5  she types, and the page answers her count:
         · UP    a fork in box one → "Give the second half its own box — $57", one tap
         · DOWN  bought two or three and only wrote one → "Then just the one — $35", one tap
    6  the bump, the disclosure, the CTA                                       — g1

  ⭐ THE MECHANISM IS UNCHANGED: the box appearing IS the demonstration. Under h2 it happens
     twice — once when she picks, and again when she accepts a correction, which is the most
     legible version of the argument there is: she taps, a box appears, that is the product.

  🔴 THE RISK THIS VERSION ANSWERS. Rungs first asks her to count things she has not written
     down. h2's answer is that the count is REVERSIBLE and the page says so out loud before she
     picks — nothing typed is ever lost, in either direction — and then the page does the
     counting for her from her own sentence. Guessing wrong costs one tap.

  ⛔ MARCUS TALKING HER DOWN SURVIVES AND GAINS A TAP. Rung one's receipt and the italic line
     under the row are g1's, unmoved. The down offer is the same argument made at the moment it
     is provably true — she has written one thing and left the box she paid for empty.
     ⛔ It is the only offer on the page that can lower what she is about to spend, and it is
     shown BEFORE the pay button ever lights, never after.

  DIFFERENT FROM THE ARCHIVED F-SERIES: F1–F5 all made the router offer an upgrade. None of
  them could move her down, and none of them told her a change was free. h2 is that half.

  ⛔ NO CONSENT TICKS. One checkbox on the page and it is the bump.
  ⛔ NEVER HARDCODE A COUNT. Every number is a token off the GENERATED island.
     node scripts/build-07-booking-data.mjs · --check fails on drift.

  Review:  ?c=1&s=the-weight   ?c=2&s=the-two-doors   ?c=3&s=the-zodiac-spread

/* ══ H · what the reorder forced, and nothing else ══════════════════════════════════════════
   ⛔ Every other string above is g1's, untouched. These three had to change because they name
      a box that, under this flow, has not appeared yet. */

/* she has not typed when she reads this rung */
COPY.rungs.spread.body[0] =
  "The {N_DOWN_WORD} that went face down in this morning’s email, turned over on the one thing " +
  "you ask me. What it actually is, what it’s costing you, and what would move it.";

/* the promise at the end of a fork reading depends on whether a second box exists yet, so it is
   a token. ⭐ promiseRung is 07-C1-FLOWS.md's own approved line for exactly this case: under
   package-first the router cannot point at a box, it can only offer to buy one. */
COPY.router.fork = "You’ve asked me two things in one sentence — whether to stay, and whether to go now. " +
  "Both can be laid. {PROMISE}";
COPY.router.marks = "That’s {N} questions in one box. {PROMISE}";
COPY.router.hat = "A second question with a polite hat on. {PROMISE}";
COPY.promiseOpen = "<b>The second box is already open — put the other half in it.</b>";
COPY.promiseRung = "<b>Give the second half its own box — {PRICE}.</b>";
/* ══ h2 · REVERSIBLE — its own copy. ⚠ NEW, needs sign-off. ═══════════════════════════════ */

/* frameH is g1's, untouched. frameP1 said "in that box" and there is no box yet. */
COPY.frameP1 = "You don’t have to get this right first go. Tell me the number you came with, and " +
  "if what you write says something different I’ll say so before you pay.";
/* frameP2 is g1's, untouched. */

/* the sentence that makes the count a draft, under the row of rungs */
COPY.keep = "Change the number as often as you like. Nothing you’ve typed goes anywhere.";

/* UP — 07-C1-FLOWS.md's approved wording, now that it is a control and not a sentence */
COPY.upAct = "Give the second half its own box — {PRICE}";

/* DOWN — Marcus’s own argument, made at the one moment it is provably true */
COPY.downOffer = "You’ve written the one thing and left the box you paid for empty. If there’s " +
  "only the one, don’t pay me for two.";
COPY.downAct = "Then just the one — {PRICE}";

</script>

<script>
/* ══ THE PLUMBING — registry, tokens, the board, the router. Shared by all five. ══ */

const S3 = "https://luna-assets-tsw.s3.ap-southeast-2.amazonaws.com/";
const REG = JSON.parse(document.getElementById("registry").textContent
  .replace("/*BEGIN-REGISTRY*/", "").replace("/*END-REGISTRY*/", "").trim());

const WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const w = n => WORDS[n] || String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money = n => "$" + (Number(n) % 1 ? Number(n).toFixed(2) : Number(n));
const $ = id => document.getElementById(id);

const qs = new URLSearchParams(location.search);
const sKey = qs.get("s") || "";
const c = ({"1":1,"2":2,"3":3})[qs.get("c")] || 3;
const SP = REG.spreads[sKey] || null;
const recovering = qs.get("recover") === "1";
const app = document.getElementById("app");

if (!SP) {
  app.innerHTML = '<div class="lost"><h1>' + esc(COPY.lostH) + '</h1><p>' + esc(COPY.lostP) + '</p>' +
    '<div class="keys">for review only &mdash; the seven days:<br>' +
    Object.keys(REG.spreads).map(k => '<a href="?c=1&amp;s=' + k + '">' + esc(k) + '</a>').join(" &middot; ") +
    '</div></div>';
  throw new Error("no spread");
}

const N_FREE = SP.counts.free, N_DOWN = SP.counts.paid, N_TOTAL = SP.counts.spread;
const TIER_TOTAL = { spread: SP.counts.spread, pattern: SP.counts.pattern, table: SP.counts.table };
const OPEN_PER = REG.tier_model.open_per_question;
const ORDER = REG.tier_model.order;
const PRICE = k => REG.tier_model.tiers[k].price_usd;
const NQ = { spread: 1, pattern: 2, table: 3 };
const TIER_OF = { 1: "spread", 2: "pattern", 3: "table" };
const FREE_NAMES = SP.free.map(p => p.card)
  .reduce((a, x, i, arr) => i === 0 ? x : (i === arr.length - 1 ? a + " and " + x : a + ", " + x), "");

const fill = s => String(s)
  .replace(/\{N_FREE_WORD_CAP\}/g, cap(w(N_FREE))).replace(/\{N_DOWN_WORD_CAP\}/g, cap(w(N_DOWN)))
  .replace(/\{N_TOTAL_WORD_CAP\}/g, cap(w(N_TOTAL))).replace(/\{OPEN_PER_WORD_CAP\}/g, cap(w(OPEN_PER)))
  .replace(/\{N_FREE_WORD\}/g, w(N_FREE)).replace(/\{N_DOWN_WORD\}/g, w(N_DOWN))
  .replace(/\{N_TOTAL_WORD\}/g, w(N_TOTAL)).replace(/\{OPEN_PER_WORD\}/g, w(OPEN_PER))
  .replace(/\{OPEN_PER\}/g, OPEN_PER)
  .replace(/\{N_FREE\}/g, N_FREE).replace(/\{N_DOWN\}/g, N_DOWN).replace(/\{N_TOTAL\}/g, N_TOTAL)
  .replace(/\{FREE_NAMES\}/g, FREE_NAMES)
  .replace(/\{THOSE\}/g, N_FREE > 1 ? "those" : "it");

function drawDate() {
  const want = ["sun","mon","tue","wed","thu","fri","sat"].indexOf(SP.day);
  const pin = qs.get("d");
  /* ⛔ &d only pins a date that IS this spread's weekday, or the masthead prints a lie. */
  if (pin && /^\d{4}-\d{2}-\d{2}$/.test(pin)) {
    const d = new Date(pin + "T06:00:00");
    if (d.getDay() === want) return d;
  }
  const d = new Date(); d.setHours(6,0,0,0);
  while (d.getDay() !== want) d.setDate(d.getDate() - 1);
  return d;
}
const DD = drawDate();
const DATE_STR = DD.toLocaleDateString("en-GB", { day:"numeric", month:"long" });
const DAY_STR = cap(DD.toLocaleDateString("en-GB", { weekday:"long" }));
const EX = COPY.examples[sKey] || ["","",""];
const CROP = COPY.backCrop[sKey] || { size:"600%", x:"50%", y:"50%" };
const BOARD_VARS = "--down:url('" + S3 + SP.down + "');--bsize:" + CROP.size +
  ";--bx:" + CROP.x + ";--by:" + CROP.y;

/* ── THE BOARD. The whole day spread — every card turned this morning AND every card still face
   down, straight off the registry: 6 on Monday, 8 on Tuesday, 12 on Sunday, which is the most
   there is.
   ⛔ THE OPEN CARDS ARE NOT ON IT and are not named until she picks a rung that includes them.
      Everything the day spread holds is bought at every rung, so drawing all of it is honest;
      the open cards are not bought at $35, so they are not on the table she is looking at. */
function boardHTML(tappable) {
  const upHTML = SP.free.map((p, i) => (tappable
      ? '<button class="k" type="button" aria-pressed="false" data-kind="up" data-i="' + i + '">'
      : '<figure class="k">') +
    '<img class="face" src="' + S3 + 'evelyn/tarot-rws/' + p.slug + '.jpg" alt="' + esc(p.card) +
    '" width="350" height="600" decoding="async" loading="lazy">' +
    '<span class="cap">' + esc(p.card) + '</span>' +
    (tappable ? '</button>' : '</figure>')).join("");
  const dnHTML = SP.paid.map((p, i) => (tappable
      ? '<button class="k" type="button" aria-pressed="false" data-kind="down" data-i="' + i +
        '" aria-label="Position ' + p.n + ', ' + esc(p.name) + ' — face down">'
      : '<span class="k" role="img" aria-label="Position ' + p.n + ', ' + esc(p.name) + ' — face down">') +
    '<span class="back"><span class="num">' + p.n + '</span></span>' +
    (tappable ? '</button>' : '</span>')).join("");
  return '<div class="board" style="' + BOARD_VARS + '">' +
    '<div class="band"><p class="dl">' + esc(COPY.bandUp) + '</p>' +
      '<div class="cards up">' + upHTML + '</div></div>' +
    '<div class="band"><p class="dl">' + esc(COPY.bandDown) + '</p>' +
      '<div class="cards dn">' + dnHTML + '</div></div>' +
    '<p class="tally">' + fill(COPY.tally) + '</p></div>';
}

function wireBoard(readoutId) {
  const out = $(readoutId);
  const idle = () => { out.innerHTML = '<span class="rs">' + esc(COPY.tapHint) + '</span>'; };
  document.querySelectorAll("button.k").forEach(b => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") === "true";
    document.querySelectorAll("button.k").forEach(x => x.setAttribute("aria-pressed", "false"));
    if (on) return idle();
    b.setAttribute("aria-pressed", "true");
    const i = +b.dataset.i;
    const p = b.dataset.kind === "up" ? SP.free[i] : SP.paid[i];
    const t = b.dataset.kind === "up"
      ? [COPY.tappedUp.replace("{CARD}", p.card).replace("{N}", p.n),
         COPY.tappedUpSub.replace("{NAME}", p.name)]
      : [COPY.tapped.replace("{N}", p.n).replace("{NAME}", p.name), COPY.tappedSub];
    out.innerHTML = '<span class="rt">' + esc(t[0]) + '</span><span class="rs">' + esc(t[1]) + '</span>';
  }));
  idle();
}

/* ⛔ The router reports what she TYPED — a fact about her own sentence she can check by reading
   it back — never what she needs. It cannot open a box; only a rung can. */
function routerRead(v) {
  const t = String(v || ""), l = t.toLowerCase();
  const marks = (t.match(/\?/g) || []).length;
  if (/\bshould i (stay|go|leave)\b/.test(l) || /\bstay or\b/.test(l) || /\bor should i\b/.test(l))
    return { fork: true, html: COPY.router.fork };
  if (/\s+or\s+/.test(l)) return { fork: true, html: COPY.router.fork };
  if (marks > 1) return { fork: true, html: COPY.router.marks.replace("{N}", w(marks)) };
  if (/\b(and what about|also|the other thing|one more thing)\b/.test(l))
    return { fork: true, html: COPY.router.hat };
  if (t.trim().length > 12) return { fork: false, html: COPY.router.one };
  return null;
}
/* the target pre-fills box two off the "or" she already typed — the second half she was losing */
function splitOr(a, b) {
  const m = a.value.split(/\s+or\s+/i);
  if (m.length > 1 && !b.value.trim()) {
    b.value = cap(m.slice(1).join(" or ").trim());
    a.value = m[0].trim().replace(/[,\s]+$/, "") + "?";
  }
}
function payload(tier, arr, bumpOn) {
  return JSON.stringify({
    spread_key: sKey, tier, bump: bumpOn ? REG.bump.product_key : null,
    questions: arr, cards_sold: TIER_TOTAL[tier], c }, null, 2);
}
/* the target's own fullness rule: more than three characters counts as answered */
const answered = el => (el.value || "").trim().length > 3;
function ctaLabel(n, price) { return COPY.ctaGo[n] + " — " + money(price); }
function leftLabel(k) { return COPY.left.replace("{N}", k).replace("{S}", k > 1 ? "es" : ""); }
function saver(key, get) {
  return () => { try { localStorage.setItem(key + ":" + sKey, JSON.stringify(get())); } catch (e) {} };
}
function restore(key) {
  try { return JSON.parse(localStorage.getItem(key + ":" + sKey) || "{}"); } catch (e) { return {}; }
}


function rungProse(key) {
  const cp = COPY.rungs[key];
  return cp.body.map(p => '<p>' + fill(esc(p)) + '</p>').join("") +
    '<p class="count">' + fill(esc(cp.count)) + '</p>';
}
</script>

<script>
/* ══ H2 · REVERSIBLE — THE FORMAT. Everything below is this version's alone. ══ */

const KEY = "07-booking-h2";

let tier = null;

function boxHTML(i) {
  /* ⭐ box one is now a revealed box like the other two. Its label and hint are g1's askH/askHint
     word for word — what changed is when it appears, not what it says. */
  const b = i === 1 ? { h: COPY.askH, hint: COPY.askHint } : COPY.box[i];
  return '<div class="q extra" id="box' + i + '" hidden>' +
    '<label for="q' + i + '">' + esc(b.h) + '</label>' +
    '<p class="hint">' + esc(b.hint) + '</p>' +
    '<textarea id="q' + i + '" placeholder="' + esc(EX[i - 1]) + '"></textarea>' +
    (i === 1 ? '<div class="router" id="router" hidden></div>' : '') +
    '</div>';
}

/* 🔴 THE BOX THAT OPENS MUST BE WHERE SHE IS LOOKING. Under the H flow every box is revealed
   below the control she just used, so it can be off the bottom of a 390px phone. The page goes
   there and puts the caret in it. ⛔ focus() must not scroll on its own or it fights this. */
function carry(el) {
  if (!el) return;
  el.closest(".q, .ask").scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(function () { el.focus({ preventScroll: true }); }, 340);
}

function rungHTML(key) {
  const t = REG.tier_model.tiers[key], cp = COPY.rungs[key];
  return '<button class="rung" type="button" data-t="' + key + '">' +
    '<div class="top"><h3>' + esc(cp.h) + '</h3><span class="price">' + money(t.price_usd) + '</span></div>' +
    rungProse(key) + '</button>';
}

app.innerHTML =
  (recovering ? '<div class="recover">' + esc(COPY.recover) + '</div>' : '') +
  '<div class="page">' +
  '<div class="mast"><div class="n">Marcus Stone</div>' +
    '<div class="s">Daily Tarot &middot; The Seer Within</div>' +
    '<div class="d">' + esc(DAY_STR) + ' &middot; ' + esc(SP.name) + ' &middot; cut ' + esc(DATE_STR) + '</div></div>' +

  '<h1>' + fill(esc(COPY.h1)) + '</h1>' +
  '<p class="lede">' + fill(esc(COPY.lede)) + '</p>' +

  '<div class="strip"><h2>' + fill(esc(COPY.stripH)) + '</h2>' +
    '<p>' + fill(esc(COPY.stripP)) + '</p>' + boardHTML(false) + '</div>' +

  '<div class="frame"><h2>' + esc(COPY.frameH) + '</h2>' +
    '<p>' + esc(COPY.frameP1) + '</p><p>' + fill(esc(COPY.frameP2)) + '</p></div>' +
  '<div class="rungs" id="rungs">' + ORDER.map(rungHTML).join("") + '</div>' +
  '<p class="down">' + esc(COPY.down) + '</p>' +
  /* ⭐ the count is a draft, and the page says so before she has to make it */
  '<p class="keep">' + esc(COPY.keep) + '</p>' +

  /* ⭐ THE MECHANISM. Every box she bought, box one included, is born under the rung she just
     tapped, and the page carries her to the first empty one. */
  boxHTML(1) + boxHTML(2) + boxHTML(3) +

  /* ⛔ THE ONE OFFER ON THIS PAGE THAT LOWERS THE PRICE. It is shown while the pay button is
     still dark, never after it lights. */
  '<div class="offer" id="offerDown" hidden><p>' + esc(COPY.downOffer) + '</p>' +
    '<button class="act" type="button" id="downBtn"></button></div>' +

  '<label class="bump" id="bumpRow" hidden><input type="checkbox" id="bump">' +
    '<span class="t"><b id="bumpT"></b>' + esc(COPY.bumpD) + '</span></label>' +

  '<div class="disc"><p>' + esc(COPY.disc) + '</p></div>' +

  '<button class="cta" id="cta" disabled></button>' +
  '<p class="left" id="left"></p>' +
  '<p class="under">' + esc(COPY.under) + '</p>' +
  '</div>';

const q1 = $("q1"), q2 = $("q2"), q3 = $("q3"), QQ = [q1, q2, q3];
$("bumpT").textContent = COPY.bumpT.replace("{PRICE}", money(REG.bump.price_usd));
$("downBtn").textContent = COPY.downAct.replace("{PRICE}", money(PRICE("spread")));
const save = saver(KEY, () => ({ q1:q1.value, q2:q2.value, q3:q3.value, tier, bump:$("bump").checked }));

/* ⛔ The router still only REPORTS what she typed — it cannot open a box. What it can do here
   is offer a RUNG, and the rung opens the box. That is the same rule, not an exception to it. */
function route() {
  const r = routerRead(q1.value), el = $("router");
  el.hidden = !r;
  if (!r) return;
  const n = tier ? NQ[tier] : 1;
  const promise = (n >= 2 ? COPY.promiseOpen : COPY.promiseRung).replace("{PRICE}", money(PRICE("pattern")));
  el.innerHTML = '<p>' + fill(r.html).replace("{PROMISE}", promise) + '</p>' +
    (r.fork && n < 2
      ? '<button class="act" type="button" id="upBtn">' +
        esc(COPY.upAct.replace("{PRICE}", money(PRICE("pattern")))) + '</button>'
      : '');
  const up = $("upBtn");
  /* ⛔ the split is never silent here: she asked for it, and the label said what it would do */
  if (up) up.addEventListener("click", function () { splitOr(q1, q2); setTier("pattern", true); });
}

/* the down offer is true only when she has answered the first box and left every box she PAID
   for empty. The moment she types into one of them it is no longer true, and it goes. */
function offers() {
  const n = tier ? NQ[tier] : 0;
  const show = n >= 2 && answered(q1) && QQ.slice(1, n).every(function (el) { return !answered(el); });
  $("offerDown").hidden = !show;
}
$("downBtn").addEventListener("click", function () { setTier("spread", false); });

function firstEmpty(n) { return QQ.slice(0, n).filter(function (el) { return !answered(el); })[0] || null; }

function setTier(key, moveTo) {
  tier = key;
  document.querySelectorAll("#rungs .rung").forEach(function (b) { b.classList.toggle("on", b.dataset.t === key); });
  const n = NQ[key];
  $("box1").hidden = false;
  $("box2").hidden = n < 2;
  $("box3").hidden = n < 3;
  $("bumpRow").hidden = false;
  /* ⛔ NOTHING TYPED IS EVER CLEARED. A box she has left behind is hidden, and its text is
     still in it if she comes back up. That is what makes COPY.keep true. */
  route(); offers(); sync();
  if (moveTo) carry(firstEmpty(n) || q1);
}
document.querySelectorAll("#rungs .rung").forEach(function (b) {
  b.addEventListener("click", function () { setTier(b.dataset.t, true); });
});

function sync() {
  save();
  const cta = $("cta"), left = $("left");
  if (!tier) { cta.disabled = true; cta.textContent = COPY.ctaWait; left.textContent = ""; return; }
  const n = NQ[tier], price = PRICE(tier) + ($("bump").checked ? REG.bump.price_usd : 0);
  const empty = QQ.slice(0, n).filter(function (el) { return !answered(el); }).length;
  cta.disabled = empty > 0;
  cta.textContent = empty ? COPY.ctaWaitBox : ctaLabel(n, price);
  left.textContent = empty ? leftLabel(empty) : "";
}
QQ.forEach(function (el) {
  el.addEventListener("input", function () { if (el === q1) route(); offers(); sync(); });
});
$("bump").addEventListener("change", sync);
$("cta").addEventListener("click", function () { alert("[mockup] → Stripe\n\n" +
  payload(tier, QQ.slice(0, NQ[tier]).map(function (el) { return el.value; }), $("bump").checked)); });

if (recovering) {
  const s = restore(KEY);
  q1.value = s.q1 || ""; q2.value = s.q2 || ""; q3.value = s.q3 || "";
  if (s.bump) $("bump").checked = true;
  if (s.tier) setTier(s.tier, false);
}
route(); offers(); sync();
</script>
</body>
</html>
