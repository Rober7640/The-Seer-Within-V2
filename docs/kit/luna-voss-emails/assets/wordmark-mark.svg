<!-- wordmark-mark.svg — Luna Voss footer stamp: tiny 48px simplified natal-wheel mark -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="Luna Voss mark">
  <g stroke="#B6863C" stroke-width="1.25" fill="none" stroke-linecap="round">
    <circle cx="24" cy="24" r="22"/>
    <circle cx="24" cy="24" r="13"/>
    <!-- 4 spokes (cardinal) -->
    <line x1="24" y1="2" x2="24" y2="46"/>
    <line x1="2" y1="24" x2="46" y2="24"/>
    <!-- 4 spokes (diagonal, short) on outer band only -->
    <line x1="8.4" y1="8.4" x2="14.6" y2="14.6"/>
    <line x1="39.6" y1="8.4" x2="33.4" y2="14.6"/>
    <line x1="8.4" y1="39.6" x2="14.6" y2="33.4"/>
    <line x1="39.6" y1="39.6" x2="33.4" y2="33.4"/>
  </g>
  <!-- center + 3 planet dots -->
  <g fill="#B6863C" stroke="none">
    <circle cx="24" cy="24" r="2"/>
    <circle cx="24" cy="11" r="1.6"/>
    <circle cx="35" cy="29" r="1.4"/>
    <circle cx="14" cy="30" r="1.4"/>
  </g>
</svg>
