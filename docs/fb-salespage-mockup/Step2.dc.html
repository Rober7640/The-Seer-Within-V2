<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sales page, her words</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
textarea::placeholder{color:#857C8E}
a{color:#5B146F}a:hover{color:#2D0458}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFBF4; font-family: Archivo, Helvetica, Arial, sans-serif; color: #373737; overflow: hidden">
  <div style="height: 52px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #E8E4D8">
    <span style="font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 23px; letter-spacing: 0.5px; color: #2D0458">the seer within</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 22px 20px 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="height: 4px; flex-grow: 1; background: #FB0797"></span>
      <span style="height: 4px; flex-grow: 1; background: #FB0797"></span>
      <span style="height: 4px; flex-grow: 1; background: #E2DCE8"></span>
      <span style="font-size: 12px; font-weight: 600; color: #5B146F; letter-spacing: 0.4px">Step 2 of 3</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <img src="../../uploads/avatars/hi-def/evelyn.png" alt="Evelyn" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: 50% 30%">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 16px; color: #2D0458">Evelyn</span>
        <span style="font-size: 13px; color: #6B6475">Ireland</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.1; letter-spacing: -0.5px; color: #2D0458">Thank you, Jules.</h1>
      <label for="herWords" style="font-size: 17px; line-height: 1.45; color: #373737">Now tell me what keeps happening. One sentence is enough, in your own words.</label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #6B6475">Tap one to start, or write your own:</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{starters}}" as="s" hint-placeholder-count="3">
          <button type="button" onClick="{{s.pick}}" style="min-height: 44px; padding: 8px 14px; border: 1px solid #D1007B; border-radius: 22px; background: #FFF7FB; color: #2D0458; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{s.text}}</button>
        </sc-for>
      </div>
    </div>
    <textarea id="herWords" rows="4" value="{{words}}" onChange="{{onWords}}" placeholder="Write it the way you'd say it to a friend." style="height: 112px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #BDB3C9; background: #FFFFFF; font-family: inherit; font-size: 17px; line-height: 1.4; color: #2D0458; resize: none"></textarea>
    <a href="Step3.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; background: {{cta}}; color: {{ctaInk}}; text-decoration: none; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">Continue</a>
    <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #5B146F">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B146F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="1"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      Only Evelyn reads what you write.
    </p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cta":{"editor":"color","default":"#63D39A","options":["#63D39A","#D1007B","#2D0458"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cta = this.props.cta ?? '#63D39A';
    let h = String(cta).replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16) || 0;
    const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
    const st = this.state || {};
    const starters = ['He pulls away.', "Money won't stay.", 'I keep starting over.'].map((t) => ({
      text: t,
      pick: () => this.setState({ words: t + ' ' }),
    }));
    return {
      cta: cta,
      ctaInk: L > 0.3 ? '#1F0340' : '#FFFFFF',
      words: st.words != null ? st.words : '',
      onWords: (e) => this.setState({ words: e.target.value }),
      starters: starters,
    };
  }
}
</script>
</body>
</html>
